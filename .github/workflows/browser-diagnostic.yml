name: Read-only browser diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: doomsday-browser-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: false
      - run: uv sync --locked --no-dev
      - run: uv run --locked --no-dev playwright install --with-deps chromium
      - run: xvfb-run -a uv run --locked --no-dev python -m doomsday.diagnostic
