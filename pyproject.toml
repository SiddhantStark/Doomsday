[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "doomsday-ticket-monitor"
version = "0.1.0"
description = "A Telegram ticket-monitor foundation with isolated fixture previews"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "playwright>=1.50,<2",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "truststore>=0.10.4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
doomsday = "doomsday.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
